<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Coding Quiz</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body {
            margin: 0; padding: 16px; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: #0f172a; color: #f8fafc;
        }
        .card {
            width: 100%; max-width: 400px; background: #1e293b;
            padding: 28px; border-radius: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        h1 { margin-top: 0; font-size: 1.5rem; text-align: center; color: #38bdf8; }
        label { display: block; margin-top: 14px; font-size: 0.9rem; color: #cbd5e1; }
        input {
            width: 100%; padding: 12px; margin-top: 6px; border-radius: 8px;
            border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 1rem;
        }
        button {
            width: 100%; margin-top: 20px; padding: 12px; border: none; border-radius: 8px;
            background: #38bdf8; color: #0f172a; font-weight: 700; font-size: 1rem; cursor: pointer;
        }
        button:hover { background: #0ea5e9; }
        .msg { padding: 10px; border-radius: 8px; margin-bottom: 12px; background: #991b1b; font-size: 0.9rem; }
        .admin-link { text-align: center; margin-top: 18px; font-size: 0.85rem; }
        .admin-link a { color: #94a3b8; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Coding Quiz Portal</h1>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for msg in messages %}
                    <div class="msg">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <label for="quiz_code">Secret Quiz Code</label>
            <input type="text" id="quiz_code" name="quiz_code" placeholder="Enter Secret Code" required style="text-transform: uppercase;">

            <label for="student_name">Your Full Name (or USN)</label>
            <input type="text" id="student_name" name="student_name" placeholder="Enter your name" required>

            <button type="submit">Join Quiz</button>
        </form>

        <div class="admin-link">
            <a href="/admin">Admin Login →</a>
        </div>
    </div>
</body>
</html>
